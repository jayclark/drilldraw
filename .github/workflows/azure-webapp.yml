name: Build and deploy to Azure Web App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: drilldraw
  NODE_VERSION: "24.x"

permissions:
  id-token: write # OIDC login to Azure
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
      - name: Package (production dependencies only)
        if: github.event_name != 'pull_request'
        run: |
          npm prune --omit=dev
          zip -qr release.zip dist node_modules package.json
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: node-app
          path: release.zip

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-app
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: release.zip
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health; then exit 0; fi
            sleep 10
          done
          exit 1
